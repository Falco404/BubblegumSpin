name: build

# Builds and tests on Windows and Linux, and publishes the release binaries as
# downloadable artifacts. One artifact per OS, kept for 90 days (GitHub default).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    # The container has no Android SDK/NDK, so the APK is built here and nowhere else.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare the NDK
        run: |
          ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT}}}"
          test -n "$ndk" || { echo "no NDK on the runner"; exit 1; }
          echo "using NDK at $ndk"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # NDK r27 ships only `llvm-*`, but the 2025 cargo-quad-apk still looks for
          # the per-target binutils names (it wanted `ar`, then `ld`). Link them.
          for pair in ar:llvm-ar ranlib:llvm-ranlib ld:ld.lld strip:llvm-strip nm:llvm-nm objcopy:llvm-objcopy; do
            want="$bin/aarch64-linux-android-${pair%%:*}"
            have="$bin/${pair##*:}"
            test -e "$want" || ln -s "$have" "$want"
          done
          ls -l "$bin"/aarch64-linux-android-{ar,ld,ranlib}
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-quad-apk
        run: cargo install cargo-quad-apk --locked
      - name: Build the APK
        run: cargo quad-apk build --release
      - name: Show what was built
        run: |
          ls -l target/android-artifacts/release/apk/
          apk=$(ls target/android-artifacts/release/apk/*.apk | head -1)
          "$ANDROID_HOME"/build-tools/*/aapt dump badging "$apk" | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: bubblegum-spin-android
          path: target/android-artifacts/release/apk/*.apk
          if-no-files-found: error

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: bubblegum-spin-linux
            bin: target/release/bubblegum-spin
          - os: windows-latest
            artifact: bubblegum-spin-windows
            bin: target/release/bubblegum-spin.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux audio/GL/window deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin }}
          if-no-files-found: error
