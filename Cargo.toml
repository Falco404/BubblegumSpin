[package]
name = "bubblegum-spin"
version = "0.1.0"
edition = "2021"
description = "Native port of Bubblegum Spin by Bee_Randon (PICO-8)"
license = "proprietary"

[package.metadata.android]
# `cargo quad-apk` reads this block; see docs/RUNNING.md for the build.
package_name = "com.falco.bubblegumspin"
label = "BubblegumSpin"
version_code = 1
version_name = "0.1.0"
# Android 8.0: the floor that still covers phones in use, and what rustc supports.
min_sdk_version = 26
target_sdk_version = 34
android_version = 34
# Only arm64: the phone this is for, and half the build time.
build_targets = ["aarch64-linux-android"]
res = "res"
icon = "@mipmap/ic_launcher"
fullscreen = true

[package.metadata.android.activity_attributes]
"android:exported" = "true"
"android:screenOrientation" = "portrait"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
png = "0.17"

[dev-dependencies]
png = "0.17"

[profile.release]
lto = true
codegen-units = 1
